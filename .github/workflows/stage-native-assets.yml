name: Verify public native downloads
on:
  push:
    branches: [ops/stage-native-v080]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - name: Install from the public v0.8.0 links as a new user
        shell: bash
        run: |
          set -eu
          tmp=$(mktemp -d)
          export AI_REPAIR_SHOP_NATIVE_HOME="$tmp/runtime" CODEX_HOME="$tmp/codex"
          curl -fLsS --retry 2 --max-time 60 https://raw.githubusercontent.com/pandaxiong0729/ai-repair-shop/v0.8.0/portable/install-desktop.sh -o "$tmp/install.sh"
          sh "$tmp/install.sh"
          test -f "$CODEX_HOME/skills/ai-repair-shop-native/SKILL.md"
          if [ "$(uname)" = Darwin ]; then
            exe="$AI_REPAIR_SHOP_NATIVE_HOME/apps/0.8.0/AI-Repair-Shop.app/Contents/MacOS/AI-Repair-Shop"
          else
            exe="$AI_REPAIR_SHOP_NATIVE_HOME/apps/0.8.0/runtime/AI-Repair-Shop"
          fi
          test -x "$exe"
          test "$("$exe" --status)" = '{"running":false}'
