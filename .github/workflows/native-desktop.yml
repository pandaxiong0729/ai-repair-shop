name: Native desktop packages
on:
  workflow_dispatch:
  push:
    branches: ['native-desktop/**']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux windowing libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libxcb-cursor0 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install --only-binary=:all: PySide6-Essentials==6.10.3 pyinstaller==6.19.0 certifi
      - run: python -m unittest discover -s portable -p "test_*.py"
      - name: Build and exercise the desktop app
        if: runner.os != 'Linux'
        run: python portable/build.py release-build
      - name: Build and exercise on X11
        if: runner.os == 'Linux'
        run: xvfb-run -a python portable/build.py release-build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          path: release-build/publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
